name: "macos test"
on:
  push:
    branches: [ ebourne_macos_trial ]
jobs:
  build_in_docker:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          # 1. Get and enable Spack 0.23.1
          wget https://github.com/spack/spack/releases/download/v0.23.1/spack-0.23.1.tar.gz
          tar -xf spack-0.23.1.tar.gz
          rm spack-0.23.1.tar.gz
          . spack-0.23.1/share/spack/setup-env.sh
          # 2. Get and enable this spack repo
          git clone https://github.com/EmilyBourne/pdi_spack.git spack/var/spack/repos/pdi
          spack repo add spack/var/spack/repos/pdi
          spack compiler find
          spack compilers
          spack spec pdi@1.9
          export SPACK_DEBUG_LOG_DIR=spack-logs
          export SPACK_VERBOSE=1
          export SPACK_DEBUG=1
          spack install -v pdi@1.9
      - name: Logs
        if: always()
        run: |
          ls /var/folders/hn/k7g0_sh57112t0xtjxcjcm5r0000gn/T/runner/spack-stage/spack-stage-pdi-1.9.0-zqfhsh5nui5ks46i4x2dv4seo4ogw26r/spack-build-out.txt
          cat /var/folders/hn/k7g0_sh57112t0xtjxcjcm5r0000gn/T/runner/spack-stage/spack-stage-pdi-1.9.0-zqfhsh5nui5ks46i4x2dv4seo4ogw26r/spack-build-out.txt
